[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aigc-agent-framework"
version = "0.1.0"
description = "GPU-free foundation for multimedia generation workflows"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.scripts]
aigc-agent = "aigc_agent.server:main"

[tool.setuptools.packages.find]
where = ["src"]
